# Production stack: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Only Caddy is reachable from outside (ports 80/443). The API and the database
# live on a private Docker network with no published ports.
services:
  web:
    build:
      context: ./apps/web
    container_name: homehub-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN no .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [public, internal]

  api:
    build:
      context: ./apps/api
    container_name: homehub-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      TRUST_PROXY: 1
      DATABASE_URL: postgres://${POSTGRES_USER:-homehub}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:-homehub}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  db:
    image: postgres:16-alpine
    container_name: homehub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homehub}
      POSTGRES_USER: ${POSTGRES_USER:-homehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

networks:
  public:
  internal:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
