services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: homehub-web
    working_dir: /app
    command: sh -lc "npm install --prefix ./apps/web && npm --prefix ./apps/web run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://api:3001
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/apps/web/node_modules
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: homehub-api
    working_dir: /app
    command: sh -lc "cd /app/apps/api && npm install && npx prisma generate && npx prisma migrate deploy && npm run dev"
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@db:5432/homehub
    volumes:
      - .:/app
      - /app/apps/api/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: homehub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: homehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d homehub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
